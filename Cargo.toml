[package]
name = "laya-hub"
version = "0.1.0"
edition = "2021"
authors = ["Sajjad <amadeus>"]
description = "High-performance intelligent supervisor and dynamic router for MCP servers and Skills powered by Laya System-1"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shellexpand = "3.1"
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
